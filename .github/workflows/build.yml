name: Build SteelMouse (Python & Rust)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-python-windows:
    name: Build Python Executable & Installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        working-directory: steelmouse_python

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --add-data images:images mouse.py
        working-directory: steelmouse_python

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: powershell

      - name: Compile Python Inno Setup script
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'innosetup\setup_python.iss'
        shell: powershell

      - name: Stage Python Installer Artifact
        run: |
          mkdir staging
          copy innosetup\SteelMouse_Python_Setup.exe staging\SteelMouse_Python_Setup.exe
        shell: powershell

      - name: Upload Python Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SteelMouse-Python-Windows
          path: staging/*

  build-rust-windows:
    name: Build Rust Native Windows App & Installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Unit Tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: powershell

      - name: Compile Rust Inno Setup script
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'innosetup\setup_rust.iss'
        shell: powershell

      - name: Stage Rust Windows Installer Artifact
        run: |
          mkdir staging
          copy innosetup\SteelMouse_Rust_Setup.exe staging\SteelMouse_Rust_Setup.exe
        shell: powershell

      - name: Upload Rust Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SteelMouse-Rust-Windows
          path: staging/*

  build-rust-macos:
    name: Build Rust Native macOS Binaries
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Unit Tests
        run: cargo test

      - name: Build macOS Apple Silicon Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build macOS Intel Binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Stage macOS Binaries
        run: |
          mkdir -p staging
          cp target/aarch64-apple-darwin/release/steelmouse staging/steelmouse-macos-arm64
          cp target/x86_64-apple-darwin/release/steelmouse staging/steelmouse-macos-x64

      - name: Upload macOS Separate Binaries
        uses: actions/upload-artifact@v7
        with:
          name: SteelMouse-Rust-macOS
          path: staging/*

  release:
    name: Publish Release Artifacts
    needs: [build-python-windows, build-rust-windows, build-rust-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Tag Name from Commit Message or Ref
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            RAW_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$RAW_MSG" | sed -n 's/^release:\s*//p' | head -n1 | tr -d ' ')
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="v2.1.0"
            fi
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG_NAME"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          body: "Release including both Rust (recommended) and Python builds for SteelMouse."
          generate_release_notes: true
          files: release-artifacts/*
