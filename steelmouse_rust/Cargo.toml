[package]
name = "steelmouse"
version = "2.0.6"
edition = "2021"
authors = ["SteelMouse Contributors"]
description = "Native SteelSeries mouse battery system tray monitor"

[dependencies]
hidapi = "2.6"
tray-icon = "0.19"
muda = "0.15"
tao = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
